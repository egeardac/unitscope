<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Unitscope · Electronics unit converter</title>
    <meta
      name="description"
      content="Convert electrical units (V, A, Ω, F, H, W, Hz, s, J, C, mil) and see what the value does in an ideal circuit or signal model: DC and AC voltage, RC and RL curves, dBm and more."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#e8e9ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12131a" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('unitscope.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        var s = JSON.parse(localStorage.getItem('unitscope.settings') || '{}');
        if (s && s.solidPanels === true) document.documentElement.classList.add('solid-panels');
      } catch (e) {}
      document.documentElement.classList.add('booting');
    </script>
    <style>
      /*
       * Boot screen. Inlined so it paints before the bundle (and tokens.css)
       * arrives, so the few colors it needs repeat the values in tokens.css.
       */
      #boot {
        display: none;
        --b-bg: #e8e9ee;
        --b-lav: rgba(160, 145, 255, 0.3);
        --b-mint: rgba(96, 205, 160, 0.24);
        --b-text: #1b1c25;
        --b-text-3: #545768;
        --b-accent: #5442cf;
        --b-on-accent: #ffffff;
        --b-plot: #ffffff;
        --b-grid: #e2e3ea;
        --b-edge: rgba(40, 40, 70, 0.11);
        --b-trace: #5442cf;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) #boot {
          --b-bg: #12131a;
          --b-lav: rgba(124, 107, 255, 0.2);
          --b-mint: rgba(60, 190, 140, 0.13);
          --b-text: #eceef5;
          --b-text-3: #a9adbf;
          --b-accent: #b8aeff;
          --b-on-accent: #12131a;
          --b-plot: #161822;
          --b-grid: #2b2e3c;
          --b-edge: rgba(0, 0, 0, 0.35);
          --b-trace: #ab9eff;
        }
      }
      :root[data-theme='dark'] #boot {
        --b-bg: #12131a;
        --b-lav: rgba(124, 107, 255, 0.2);
        --b-mint: rgba(60, 190, 140, 0.13);
        --b-text: #eceef5;
        --b-text-3: #a9adbf;
        --b-accent: #b8aeff;
        --b-on-accent: #12131a;
        --b-plot: #161822;
        --b-grid: #2b2e3c;
        --b-edge: rgba(0, 0, 0, 0.35);
        --b-trace: #ab9eff;
      }
      .booting #boot {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 1000;
        color: var(--b-text);
        font-family: 'Inter Variable', Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      .boot-bg {
        position: absolute;
        inset: 0;
        background-color: var(--b-bg);
        background-image:
          radial-gradient(900px 600px at 8% -10%, var(--b-lav), transparent 70%),
          radial-gradient(800px 600px at 105% 110%, var(--b-mint), transparent 70%);
      }
      .boot-mark {
        position: absolute;
        left: 50%;
        top: 46%;
        width: 72px;
        height: 72px;
        transform: translate(-50%, -50%);
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 0 1px 2px rgba(25, 25, 55, 0.08), 0 10px 30px rgba(25, 25, 55, 0.12);
      }
      .boot-face,
      .boot-screen {
        position: absolute;
        inset: 0;
      }
      .boot-face {
        background: var(--b-accent);
      }
      .boot-screen {
        opacity: 0;
        background-color: var(--b-plot);
        background-image: linear-gradient(var(--b-grid) 1px, transparent 1px), linear-gradient(90deg, var(--b-grid) 1px, transparent 1px);
        background-size: 10% 25%;
        background-position: -1px -1px;
        border: 1px solid var(--b-edge);
      }
      .boot-mark svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        fill: none;
        stroke-linecap: round;
      }
      .boot-wave {
        stroke: var(--b-on-accent);
        stroke-width: 2.6;
        vector-effect: non-scaling-stroke;
      }
      .boot-ticks {
        stroke: var(--b-on-accent);
        stroke-width: 1.6;
        vector-effect: non-scaling-stroke;
        opacity: 0.8;
      }
      .boot-trace {
        stroke: var(--b-trace);
        stroke-width: 2.4;
        stroke-linejoin: round;
        opacity: 0;
      }
      .boot-caption {
        position: absolute;
        left: 50%;
        top: calc(46% + 70px);
        transform: translateX(-50%);
        display: grid;
        justify-items: center;
        gap: 2px;
        white-space: nowrap;
      }
      .boot-name {
        font-weight: 650;
        font-size: 1.15rem;
        letter-spacing: -0.01em;
      }
      .boot-status {
        font: 500 0.78rem/1.4 'JetBrains Mono Variable', ui-monospace, SFMono-Regular, Consolas, monospace;
        color: var(--b-text-3);
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <div class="boot-bg"></div>
      <div class="boot-mark">
        <div class="boot-face"></div>
        <div class="boot-screen"></div>
        <svg viewBox="0 0 32 32" preserveAspectRatio="none" aria-hidden="true">
          <path class="boot-wave" d="M6 20c3 0 3-8 6-8s3 8 6 8 3-8 6-8" />
          <path class="boot-ticks" d="M7 25h18M10 23.5v3M16 23.5v3M22 23.5v3" />
        </svg>
        <svg class="boot-trace-svg" aria-hidden="true"><path class="boot-trace" d="" /></svg>
      </div>
      <div class="boot-caption">
        <span class="boot-name">Unitscope</span>
        <span class="boot-status">Loading workspace</span>
      </div>
    </div>
    <script>
      /*
       * Intro: the logo stretches into a scope screen, a trace sweeps across
       * (the sweep doubles as the progress indicator), then the app calls
       * unitscopeBoot.finish(target) and the screen shrinks into `target`
       * (the landing logo) while the overlay fades. Shared links (?q=) and
       * "Skip intro" get a static logo that fades as soon as the app mounts.
       */
      (function () {
        var root = document.documentElement;
        var boot = document.getElementById('boot');
        var q = function (s) { return boot.querySelector(s); };
        var mark = q('.boot-mark'), face = q('.boot-face'), screen = q('.boot-screen');
        var wave = q('.boot-wave'), ticks = q('.boot-ticks'), trace = q('.boot-trace'), traceSvg = q('.boot-trace-svg');
        var caption = q('.boot-caption'), status = q('.boot-status');
        var EASE = 'cubic-bezier(.2,.7,.2,1)';
        var wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
        var anim = function (el, kf, o) {
          var opts = { fill: 'forwards', easing: EASE };
          for (var k in o) opts[k] = o[k];
          return el.animate ? el.animate(kf, opts) : { finished: Promise.resolve() };
        };

        var skip = /[?&]q=/.test(location.search) && !/[?&]intro\b/.test(location.search);
        try {
          if (localStorage.getItem('unitscope.skipIntro') === '1' && !/[?&]intro\b/.test(location.search)) skip = true;
        } catch (e) {}
        var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        var full = !skip && !reduced && !!mark.animate;
        var size = null;

        function intro() {
          var vw = innerWidth, vh = innerHeight;
          var W = Math.min(620, vw - 48), H = Math.round(Math.min(200, W * 0.34));
          size = { cx: vw / 2, cy: vh * 0.46, W: W, H: H };
          var d = '';
          for (var i = 0; i <= 240; i++) {
            var x = 12 + (i / 240) * (W - 24), y = H / 2 - H * 0.3 * Math.sin((i / 240) * Math.PI * 8);
            d += (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
          }
          traceSvg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
          trace.setAttribute('d', d);

          // 1. The icon settles in, then pauses.
          anim(mark, [{ transform: 'translate(-50%,-50%) scale(.6)', opacity: 0 }, { transform: 'translate(-50%,-50%) scale(1)', opacity: 1 }], { duration: 600, easing: 'cubic-bezier(.16,1,.3,1)' });
          anim(caption, [{ opacity: 0, transform: 'translate(-50%, 6px)' }, { opacity: 1, transform: 'translate(-50%, 0)' }], { duration: 600, delay: 200 });
          return wait(850)
            .then(function () {
              // 2. The icon stretches into a scope screen; its wave gives way to the trace.
              anim(mark, [{ width: '72px', height: '72px', borderRadius: '22px' }, { width: W + 'px', height: H + 'px', borderRadius: '16px' }], { duration: 900 });
              anim(caption, [{ top: 'calc(46% + 70px)' }, { top: size.cy + H / 2 + 22 + 'px' }], { duration: 900 });
              anim(face, [{ opacity: 1 }, { opacity: 0 }], { duration: 600, delay: 240 });
              anim(screen, [{ opacity: 0 }, { opacity: 1 }], { duration: 600, delay: 240 });
              anim(ticks, [{ opacity: 0.8 }, { opacity: 0 }], { duration: 300 });
              anim(wave, [{ opacity: 1 }, { opacity: 0 }], { duration: 500, delay: 540 });
              return wait(620);
            })
            .then(function () {
              // 3. The trace sweeps across as the progress indicator.
              var len = trace.getTotalLength();
              trace.style.strokeDasharray = len;
              trace.style.opacity = 1;
              var t0 = performance.now();
              (function tick() {
                var p = Math.min(1, (performance.now() - t0) / 1100);
                status.textContent = 'Loading workspace · ' + Math.round(p * 100) + '%';
                if (p < 1) requestAnimationFrame(tick);
              })();
              return anim(trace, [{ strokeDashoffset: len }, { strokeDashoffset: 0 }], { duration: 1100, easing: 'cubic-bezier(.45,.05,.35,1)' }).finished;
            })
            .then(function () {
              status.textContent = 'Ready';
              return wait(300);
            });
        }

        var played = full ? intro() : wait(reduced && !skip ? 500 : 0);
        var finishing = null;

        function remove() {
          root.classList.remove('booting');
          if (boot.parentNode) boot.parentNode.removeChild(boot);
          window.dispatchEvent(new Event('unitscope:boot-done'));
        }

        function finish(target) {
          if (finishing) return finishing;
          finishing = played.then(function () {
            if (!full || !target || !size) {
              return anim(boot, [{ opacity: 1 }, { opacity: 0 }], { duration: 250 }).finished.then(remove);
            }
            // 4. The screen shrinks into the target logo while the overlay fades.
            target.style.visibility = 'hidden';
            var r = target.getBoundingClientRect();
            var s = 29 / 32; // the logo's rounded square inside its 32-unit viewBox
            anim(mark, [
              { left: size.cx + 'px', top: size.cy + 'px', width: size.W + 'px', height: size.H + 'px', borderRadius: '16px' },
              { left: r.left + r.width / 2 + 'px', top: r.top + r.height / 2 + 'px', width: r.width * s + 'px', height: r.height * s + 'px', borderRadius: (9 * r.width) / 32 + 'px' },
            ], { duration: 750, easing: 'cubic-bezier(.6,0,.2,1)' });
            anim(screen, [{ opacity: 1 }, { opacity: 0 }], { duration: 400, delay: 220 });
            anim(face, [{ opacity: 0 }, { opacity: 1 }], { duration: 400, delay: 220 });
            anim(trace, [{ opacity: 1 }, { opacity: 0 }], { duration: 300, delay: 160 });
            anim(wave, [{ opacity: 0 }, { opacity: 1 }], { duration: 350, delay: 350 });
            anim(ticks, [{ opacity: 0 }, { opacity: 0.8 }], { duration: 350, delay: 400 });
            anim(caption, [{ opacity: 1 }, { opacity: 0 }], { duration: 300 });
            anim(q('.boot-bg'), [{ opacity: 1 }, { opacity: 0 }], { duration: 500, delay: 250 });
            setTimeout(function () { window.dispatchEvent(new Event('unitscope:boot-reveal')); }, 300);
            return wait(780).then(function () {
              target.style.visibility = '';
              remove();
            });
          });
          return finishing;
        }

        window.unitscopeBoot = { finish: finish };
        // Never trap the page behind the overlay if the app fails to start.
        setTimeout(function () { if (!finishing) finish(null); }, 12000);
      })();
    </script>
    <div id="root"></div>
    <noscript>Unitscope needs JavaScript to calculate and draw its graphs.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
